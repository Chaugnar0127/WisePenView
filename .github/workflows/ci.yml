name: Continuous Integration

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Code Quality & Build Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # pnpm/action-setup 从 package.json 的 packageManager 读取唯一版本。
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # 设置 Node.js，并将缓存机制切换为 pnpm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # 严格依赖安装
      # --frozen-lockfile 等价于 npm ci，它严格读取 pnpm-lock.yaml，绝不自动更新依赖
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # 直接复用已安装的 commitlint，避免 Action 额外拉取镜像；PR 与 main push 都会校验。
      - name: Validate Commits
        env:
          BEFORE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ -z "${BEFORE_SHA}" ] || [ "${BEFORE_SHA}" = "${ZERO_SHA}" ]; then
            BEFORE_SHA="$(git rev-parse --verify --quiet "${AFTER_SHA}^" || true)"
          fi
          if [ -n "${BEFORE_SHA}" ]; then
            pnpm exec commitlint --from "${BEFORE_SHA}" --to "${AFTER_SHA}" --verbose
          else
            pnpm exec commitlint --to "${AFTER_SHA}" --verbose
          fi

      # 恢复 ESLint 文件级缓存；缓存键只跟随依赖与配置，源码变化由内容哈希失效。
      - name: Restore ESLint cache
        uses: actions/cache@v4
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js', '.nvmrc') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js', '.nvmrc') }}-

      - name: Check whitespace errors
        env:
          BEFORE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: git diff --check "${BEFORE_SHA}...${AFTER_SHA}"

      # 各检查互不依赖，并行执行以缩短关键路径；
      # 类型检查与 Vite 构建拆开，避免串行等待。
      - name: Static Checks, Type Check & Build
        run: pnpm verify:ci

      - name: Verify Build Artifact
        run: test -s dist/index.html

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wisepenview-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
